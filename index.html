
<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f8f4ec">
  <meta name="description" content="En særlig besked fra Katja og Marius.">
  <title>Katja &amp; Marius — Save the Date</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="scene">
    <p class="eyebrow">EN SÆRLIG MEDDELELSE</p>

    <h1>Katja <span>&amp;</span> Marius</h1>
    <p class="subtitle">Vi har noget at dele med jer...</p>

    <button class="envelope-button" id="envelopeButton"
      aria-label="Åbn invitationen" aria-expanded="false">
      <span class="envelope" id="envelope">
        <span class="letter">
          <span class="letter-inner">
            <span class="letter-eyebrow">SAVE THE DATE</span>
            <span class="letter-title">Vi skal giftes!</span>
            <span class="letter-names">Katja &amp; Marius</span>
            <span class="letter-date">Datoen afsløres snart</span>
            <span class="letter-footer">Vi glæder os til at fejre dagen med jer</span>
          </span>
        </span>

        <span class="envelope-back"></span>
        <span class="envelope-front"></span>
        <span class="envelope-flap">
          <svg class="floral-emboss" viewBox="0 0 400 220"
            preserveAspectRatio="none"
            aria-hidden="true">

          <g class="flap-edge-lines">
            <line x1="0" y1="0" x2="200" y2="220" />
            <line x1="400" y1="0" x2="200" y2="220" />
          </g>

          <g class="floral-lines">
              <!-- Venstre gren -->
              <path d="M195 151 C160 142 125 121 92 87" />
              <path d="M147 127 C127 119 111 105 101 89" />
              <path d="M127 113 C108 113 93 105 82 92" />
              <!-- Venstre blade -->
              <path d="M120 108 C102 103 94 91 96 78 C111 82 121 93 120 108Z" />
              <path d="M101 94 C84 89 77 77 80 65 C94 69 103 80 101 94Z" />
              <path d="M145 126 C126 127 114 119 108 106 C124 105 138 112 145 126Z" />
              <!-- Højre gren -->
              <path d="M205 151 C240 142 275 121 308 87" />
              <path d="M253 127 C273 119 289 105 299 89" />
              <path d="M273 113 C292 113 307 105 318 92" />
              <!-- Højre blade -->
              <path d="M280 108 C298 103 306 91 304 78 C289 82 279 93 280 108Z" />
              <path d="M299 94 C316 89 323 77 320 65 C306 69 297 80 299 94Z" />
              <path d="M255 126 C274 127 286 119 292 106 C276 105 262 112 255 126Z" />
              <!-- Blomst venstre -->
              <path d="M82 91
                       C68 87 62 76 68 66
                       C74 56 86 58 90 68
                       C94 56 107 54 113 64
                       C120 75 113 87 101 92
                       C94 96 88 96 82 91Z" />
              <!-- Blomst højre -->
              <path d="M318 91
                       C332 87 338 76 332 66
                       C326 56 314 58 310 68
                       C306 56 293 54 287 64
                       C280 75 287 87 299 92
                       C306 96 312 96 318 91Z" />
              <!-- Små blomster -->
              <circle cx="126" cy="113" r="5" />
              <circle cx="274" cy="113" r="5" />
              <path d="M126 108 L126 118 M121 113 L131 113" />
              <path d="M274 108 L274 118 M269 113 L279 113" />
            </g>
          </svg>
          <span class="flap-monogram">
            <span class="initial">K</span>
            <span class="ampersand">&amp;</span>
            <span class="initial">M</span>
          </span>
        </span>
      </span>
    </button>

    <p class="instruction" id="instruction">Tryk på konvolutten for at åbne</p>
    <p class="signature">Med kærlighed, Katja &amp; Marius</p>
  </main>
</body>
</html>
