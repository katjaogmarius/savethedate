
<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f8f4ec">
  <meta name="description" content="En særlig besked fra Katja og Marius.">
  <title>Katja &amp; Marius — Save the Date</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="scene">
    <p class="eyebrow">EN SÆRLIG MEDDELELSE</p>

    <h1>Katja <span>&amp;</span> Marius</h1>
    <p class="subtitle">Vi har noget at dele med jer...</p>

    <button class="envelope-button" id="envelopeButton"
      aria-label="Åbn invitationen" aria-expanded="false">
      <span class="envelope" id="envelope">
        <span class="letter">
          <span class="letter-inner">
            <svg class="floral-emboss" viewBox="0 0 240 240" aria-hidden="true">
              <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M120 205 C105 175 83 151 48 137 C75 138 98 149 120 176" stroke-width="2"/>
                <path d="M120 176 C139 146 163 126 194 113 C175 138 151 156 120 176" stroke-width="2"/>
                <path d="M109 161 C85 160 68 145 64 126 C85 131 102 145 109 161" stroke-width="2"/>
                <path d="M133 151 C135 128 153 107 174 103 C166 126 150 143 133 151" stroke-width="2"/>
                <path d="M120 118 C106 103 105 85 120 72 C135 85 134 103 120 118Z" stroke-width="2"/>
                <path d="M120 118 C100 117 87 104 90 86 C107 91 117 103 120 118Z" stroke-width="2"/>
                <path d="M120 118 C140 117 153 104 150 86 C133 91 123 103 120 118Z" stroke-width="2"/>
                <path d="M120 118 C103 91 107 70 120 58 C133 70 137 91 120 118Z" stroke-width="2"/>
                <path d="M48 137 C36 125 36 113 45 105 C57 117 58 127 48 137Z" stroke-width="1.5"/>
                <path d="M194 113 C205 99 205 88 195 82 C183 95 184 105 194 113Z" stroke-width="1.5"/>
                <path d="M120 205 C117 188 118 176 120 163" stroke-width="2"/>
                <path d="M120 185 C102 179 91 167 88 154" stroke-width="1.5"/>
                <path d="M120 193 C139 181 151 169 156 155" stroke-width="1.5"/>
                <circle cx="120" cy="118" r="7" stroke-width="1.5"/>
                <circle cx="120" cy="118" r="2" stroke-width="1.5"/>
              </g>
            </svg>

            <span class="letter-eyebrow">SAVE THE DATE</span>
            <span class="letter-title">Vi skal giftes!</span>
            <span class="letter-names">Katja &amp; Marius</span>
            <span class="letter-date">Datoen afsløres snart</span>
            <span class="letter-footer">Vi glæder os til at fejre dagen med jer</span>
          </span>
        </span>

        <span class="envelope-back"></span>
        <span class="envelope-front"></span>
        <span class="envelope-flap"></span>

        <span class="wax-seal" aria-hidden="true">
          <span>K <i>&amp;</i> M</span>
        </span>
      </span>
    </button>

    <p class="instruction" id="instruction">Tryk på konvolutten for at åbne</p>
    <p class="signature">Med kærlighed, Katja &amp; Marius</p>
  </main>
</body>
</html>
